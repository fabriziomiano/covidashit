[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "covidashflow"
version = "1.0.0"
description = "Prefect/Postgres ETL pipelines for the COVIDash.it monorepo."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.3",
  "prefect>=3.0,<4.0",
  "psycopg[binary]>=3.1",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
