[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "covidashit"
version = "7.0.0"
description = "COVIDash.it dashboard monorepo with FastAPI, React, Prefect, and PostgreSQL."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.137,<1.0",
  "uvicorn[standard]>=0.49,<1.0",
  "psycopg[binary]>=3.1",
  "sqlalchemy>=2.0",
  "python-dotenv>=1.0,<2.0",
  "pydantic>=2.13,<3.0",
  "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
