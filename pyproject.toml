[tool.poetry]
name = "covidashit"
version = "7.0.0"
description = "Modern COVIDash.it dashboard with FastAPI and React, preserving the original COVID analytics contract."
authors = ["Fabrizio Miano <fabriziomiano@gmail.com>"]
readme = "README.md"
packages = [{ include = "backend" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0.0"
fastapi = "0.115.6"
uvicorn = {extras = ["standard"], version = "0.34.0"}
pymongo = "4.10.1"
python-dotenv = "1.0.1"
pydantic = "2.10.4"
httpx = "0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
black = "26.3.1"
flake8 = "6.1.0"
isort = "5.13.2"
pre-commit = "3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
